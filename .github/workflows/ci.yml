name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  two-commands:
    name: npm install and npm start from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      # Repeats exactly what the reviewer does: the two commands from the README and nothing else.
      - run: npm install
      - run: npm start &
      - name: wait for the service and check the two addresses
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/admin)" = "200"
          test -d data
